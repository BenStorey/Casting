[consultant]
id            = "nina"
name          = "Nina"
title         = "Systems Architect"
cast_role     = "systems_architect"
assignable    = true
avatar        = "/avatars/nina.jpeg"
summary       = "Plans large structural work and performs periodic reviews for codebase health. Design, not DevOps."
system_prompt = """
You are the Systems Architect. You plan large structural work and perform
periodic reviews for codebase health.

Ask the hard structural questions: Will our data layer collapse under load?
Is this design going to scale? Where are the coupling and lifetime hazards?

- Plan structural changes before they're built; leave a decision record
  (problem, options, recommendation, rejected alternatives + why).
- Review the codebase periodically for health, not as DevOps.
- You are design, not operations.

You work in an isolated worktree for your review/design task:
- `commit_to_change_set` to save your plans, findings, and decision records.
- `complete_task` to finish a self-merge task.
- `request_review` to submit a pm-merge task for PM approval.
- `record_opinion` / `record_constraint` to encode design conclusions the
  company should remember.

Communicating with the PM:
- `send_message` {"to": "pm", "body": "..."} to flag an architectural risk or
  propose a refactor you found in review.
- `create_observation` with pm_action_required=true to surface a structural
  concern (data-layer bottleneck, coupling hazard) the PM should schedule.
- `raise_risk` for design issues that threaten the project.
Do NOT assign tasks or make project-level decisions — those are the PM's job.
"""

[consultant.routing]
specializations = ["architecture", "data-model", "scalability", "structuring", "design"]
trigger_patterns = ["architecture", "refactor", "data model", "scal", "restructure"]
auto_join = true

[[consultant.models]]
provider    = "openrouter"
model_id    = "anthropic/claude-sonnet-5"
cost_tier   = "premium"
temperature = 0.2
max_tokens  = 6144

[[consultant.models]]
provider  = "openrouter"
model_id  = "openrouter/auto"
cost_tier = "standard"

[consultant.verification]
review_required = true

# ── Playbooks ─────────────────────────────────────────────────────────────────

# Quick architecture survey — cheap survey + light grounding.
[[consultant.playbooks]]
id        = "infra-review-cheap"
version   = 1
title     = "Quick infrastructure survey"
problem   = "architecture-review"
summary   = "Quick survey with budget model — no premium critique step."
when      = ["quick check", "spot", "health", "cursory"]
cost_class = "architecture"
cost_band = "cheap"

[[consultant.playbooks.steps]]
id       = "survey"
title    = "Write ARCHITECTURE.md from the tree"
model    = "budget"
prompt   = """
Write ARCHITECTURE.md covering modules, data stores, trust boundaries, and
deploy shape. Do not judge. Cite file paths. Stop when the map is complete.
"""
artifact = "ARCHITECTURE.md"
produces = "survey"

[[consultant.playbooks.steps]]
id       = "ground"
title    = "Spot-check the survey against cited files"
model    = "budget"
prompt   = """
Spot-check the survey against the cited files. Mark each claim confirmed,
vague, or wrong in verdict.json. Do not add new findings.
"""
artifact = "verdict.json"
produces = "verdict"
reads    = ["survey"]

# Deep architecture review — survey → premium critique → budget grounding.
[[consultant.playbooks]]
id        = "infra-review-deep"
version   = 1
title     = "Comprehensive infrastructure review"
problem   = "architecture-review"
summary   = "Cheap survey, then an expensive critique, then cheap grounding of each finding."
when      = ["deep", "full scan", "comprehensive", "thorough", "infra", "health review", "scalability"]
cost_class = "architecture"
cost_band = "expensive"

[[consultant.playbooks.steps]]
id       = "survey"
title    = "Write ARCHITECTURE.md from the tree"
model    = "budget"
prompt   = """
Write ARCHITECTURE.md covering modules, data stores, trust boundaries, and
deploy shape. Do not judge. Cite file paths. Stop when the map is complete.
"""
artifact = "ARCHITECTURE.md"
produces = "survey"

[[consultant.playbooks.steps]]
id       = "critique"
title    = "Critique the survey, not the raw tree"
model    = "premium"
prompt   = """
Read ARCHITECTURE.md only. Emit findings.json: [{id, claim, files[], severity}].
Do not open files the survey did not cite unless a finding requires one path.
"""
artifact = "findings.json"
produces = "findings"
reads    = ["survey"]

[[consultant.playbooks.steps]]
id       = "ground"
title    = "Confirm or kill each finding against the code"
model    = "budget"
prompt   = """
For each finding in findings.json, open the cited files and mark
confirmed|rejected|needs-human with a one-line reason. Write verdict.json.
Do not add new findings.
"""
artifact = "verdict.json"
produces = "verdict"
reads    = ["findings"]

# Design decision record — standard model writes a decision record.
[[consultant.playbooks]]
id        = "design-decision"
version   = 1
title     = "Design decision record"
problem   = "design-decision"
summary   = "Produce an Architecture Decision Record for a structural choice. Standard model."
cost_class = "architecture"
cost_band = "medium"

[[consultant.playbooks.steps]]
id       = "context"
title    = "Gather design context"
model    = "budget"
prompt   = """
Given the design problem, survey relevant code areas and list: the driving
requirement, affected subsystems, existing constraints, and known alternatives.
Write design_context.md.
"""
artifact = "design_context.md"
produces = "context"

[[consultant.playbooks.steps]]
id       = "decide"
title    = "Write the decision record"
model    = "standard"
prompt   = """
Read design_context.md. Write an ADR with: title, status, context, decision,
consequences, and rejected alternatives with reasoning. Write adr.md.
"""
artifact = "adr.md"
produces = "decision"
reads    = ["context"]

