[package]
name = "casting"
version = "0.1.0"
edition = "2021"
description = "Casting — autonomous software company in a box (headless core, slice one)"
license = "Apache-2.0"
build = "build.rs"

# Single binary for now; name the lib crate so both the CLI (main.rs) and
# integration tests (tests/) can reach the same modules.
[lib]
name = "casting"
path = "src/lib.rs"

[[bin]]
name = "cast"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
# Postgres backend: the async tokio-postgres driver runs on a dedicated
# background thread owned by PostgresBackend, so the store traits stay sync and
# work from any thread (incl. our tokio server). Swappable behind the storage
# traits.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

# Web server (axum) + runtime for the vertical slice.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tower = "0.5"
futures = "0.3"

# D2: real LLM provider client (OpenAI-compatible chat/completions; OpenRouter
# day-one, LiteLLM/local later — provider is config (base_url+key+model), not code).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

# Embed the built React SPA into the binary so `cast run` ships one artifact.
rust-embed = "8"

# Structured logging (env_logger / RUST_LOG).
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
