# Lead Programmer — the default implementation workhorse.
#
# Handles the vast majority of requests (default ~90%). Writes code, fixes
# bugs, implements features at high volume. Cheap model — it is the primary
# cost sink, so keep it lean. Self-merges trivial/peripheral changes (see the
# tiered merge policy: merge_authority).

[consultant]
id            = "lead-programmer"
name          = "Lead Programmer"
title         = "Lead Programmer"
role          = "lead-programmer"
assignable    = true
max_concurrent = 2
avatar        = "/avatars/engineer.svg"
summary       = "Default implementation work. Writes code, fixes bugs, implements features at high volume."
system_prompt = "prompts/lead-programmer.md"

[consultant.routing]
specializations = ["implementation", "bug", "feature", "refactor", "rust", "typescript", "react"]
trigger_patterns = ["implement", "build", "fix", "bug", "feature", "add"]
auto_join = true

[[consultant.models]]
provider    = "openrouter"
model_id    = "deepseek/deepseek-chat"
cost_tier   = "budget"
temperature = 0.2
max_tokens  = 4096

[[consultant.models]]
provider  = "openrouter"
model_id  = "luna/luna-1"
cost_tier = "budget"

[consultant.verification]
review_required = true
