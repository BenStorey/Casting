# Systems Architect — plans large structural work + periodic health reviews.
#
# Plans large structural work and performs periodic reviews for codebase
# health. "Will our data layer collapse under load?" Not DevOps — design.
# Typically summoned by the PM for Tier-2 (high blast radius) work.

[consultant]
id            = "systems-architect"
name          = "Systems Architect"
title         = "Systems Architect"
role          = "systems-architect"
assignable    = true
avatar        = "/avatars/architect.svg"
summary       = "Plans large structural work and performs periodic reviews for codebase health. Design, not DevOps."
system_prompt = "prompts/systems-architect.md"

[consultant.routing]
specializations = ["architecture", "data-model", "scalability", "structuring", "design"]
trigger_patterns = ["architecture", "refactor", "data model", "scal", "restructure"]
auto_join = true

[[consultant.models]]
provider    = "openrouter"
model_id    = "anthropic/claude-sonnet-5"
cost_tier   = "premium"
temperature = 0.2
max_tokens  = 6144

[[consultant.models]]
provider  = "openrouter"
model_id  = "openrouter/auto"
cost_tier = "standard"

[consultant.verification]
review_required = true
