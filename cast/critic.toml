# The Critic — reads PRs and generates adversarial stress scenarios.
#
# Reads PRs and generates stress scenarios: "What happens at 10,000 requests?
# What if the DB is down? What about Unicode garbage input?" Produces scenarios
# for the Lead Programmer to evaluate; accepted ones become regression tests via
# the Test Engineer. Called upon rarely, for substantial changes.

[consultant]
id            = "critic"
name          = "The Critic"
title         = "The Critic"
role          = "critic"
assignable    = true
avatar        = "/avatars/critic.svg"
summary       = "Reads PRs and generates adversarial stress scenarios. What breaks at scale, under failure, or on hostile input?"
system_prompt = "prompts/critic.md"

[consultant.routing]
specializations = ["review", "adversarial", "stress", "security", "failure", "edge"]
trigger_patterns = ["review", "stress", "adversarial", "what if", "hardening"]
auto_join = true

[[consultant.models]]
provider    = "openrouter"
model_id    = "anthropic/claude-sonnet-5"
cost_tier   = "premium"
temperature = 0.4
max_tokens  = 6144

[[consultant.models]]
provider  = "openrouter"
model_id  = "openrouter/auto"
cost_tier = "standard"

[consultant.verification]
review_required = false
