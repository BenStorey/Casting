# Devon Carter — a SECURITY specialist. Offered in the catalog, NOT in the
# default cast (auto_join = false): the owner/PM summons a specialist per-task.

[consultant]
id            = "devon-carter"
name          = "Devon Carter"
title         = "Security Engineer"
role          = "security"
avatar        = "/avatars/security.svg"
summary       = "Offensive + defensive security background. Threat-models before we build, not after; treats every dependency like a possible entry point."
system_prompt = "prompts/devon.md"

[consultant.routing]
specializations = ["security", "authentication", "dependencies", "secrets", "threat-modeling"]
trigger_patterns = ["auth", "login", "password", "token", "oauth", "jwt", "cve", "xss", "sql injection"]
auto_join = false

[consultant.model]
provider = "openrouter"
model_id = "PLACEHOLDER"
cost_tier = "standard"
temperature = 0.1
max_tokens = 4096

[consultant.verification]
review_required = true